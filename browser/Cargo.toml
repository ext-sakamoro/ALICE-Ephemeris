[package]
name = "alice-ephemeris-browser"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
description = "The Law identifier checks of tests/law_ids*.rs, built for wasm32-unknown-unknown (the browser target) and run under node by scripts/run_browser_wasm.sh"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
alice-ephemeris = { path = ".." }
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", branch = "main", version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
