name: CI

# Every step here is mirrored in scripts/preflight.sh (generated from the
# workflows, run before `git push`).
#
# The crate promises the same bits on every target, so the test matrix is the
# product: tests/law_ids.rs pins SHA-256 digests of every conversion's outputs
# and each lane (5 native platforms, debug and release, and wasm32) must
# reproduce them; the browser job runs the Law id checks on
# wasm32-unknown-unknown, the target a web page loads.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # aarch64-apple-darwin, x86_64-apple-darwin, x86_64 / aarch64 linux-gnu, x86_64 windows-msvc
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (debug)
        run: cargo test --locked
      - name: Test (release)
        run: cargo test --locked --release
      # without std: alice-det-math's software sqrt must give the same digests
      - name: Test (no default features)
        run: cargo test --locked --no-default-features

  wasm:
    name: Test (wasm32-wasip1 via wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Ensure wasm32-wasip1 rust-std is installed
        run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-wasip1
      # wasmtime at a pinned version and checksum: the setup action takes "latest" (once without
      # assets yet) and its download host once answered 504; the binary is cached by version and
      # the download retried, a mismatching checksum fails
      - name: Cache wasmtime
        id: wasmtime-cache
        uses: actions/cache@v6
        with:
          path: ~/.wasmtime-v49.0.2
          key: wasmtime-v49.0.2-x86_64-linux
      - name: Install wasmtime
        if: steps.wasmtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz
          mkdir -p ~/.wasmtime-v49.0.2
          # first source: the release tarball, checked against its recorded SHA-256
          if curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/wasmtime.tar.xz" "$url"; then
            echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C ~/.wasmtime-v49.0.2 --strip-components=1
          else
            # second source when the release host keeps failing: the same version from crates.io,
            # with the crate's own lock file (cargo checks every downloaded crate's checksum)
            echo "release download failed; building wasmtime-cli 49.0.2 from crates.io"
            cargo install wasmtime-cli --version 49.0.2 --locked --root "$RUNNER_TEMP/wasmtime-cli"
            cp "$RUNNER_TEMP/wasmtime-cli/bin/wasmtime" ~/.wasmtime-v49.0.2/wasmtime
          fi
      - name: Check wasmtime runs
        shell: bash
        run: |
          echo "$HOME/.wasmtime-v49.0.2" >> "$GITHUB_PATH"
          "$HOME/.wasmtime-v49.0.2/wasmtime" --version
      - name: Every integration test under wasmtime (debug, then release)
        run: |
          scripts/run_wasm_tests.sh
          scripts/run_wasm_tests.sh --release

  browser:
    name: Law ids on wasm32-unknown-unknown (browser target, via node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Ensure wasm32-unknown-unknown rust-std is installed
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-unknown
          workspaces: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: rustfmt (browser/)
        run: cargo fmt --manifest-path browser/Cargo.toml -- --check
      - name: clippy (browser/, wasm32-unknown-unknown)
        run: cargo clippy --locked --manifest-path browser/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # every check of tests/law_ids*.rs, debug then release; red if one traps,
      # none ran, or the count differs from the #[test] functions
      - name: Law id checks under node (debug, then release)
        run: scripts/run_browser_wasm.sh
      # sky/: the module a web page loads (sun_alt_az only); its native test pins the outputs,
      # the runner checks the wasm build gives the same bits and exports nothing else
      - name: rustfmt (sky/)
        run: cargo fmt --manifest-path sky/Cargo.toml -- --check
      - name: clippy (sky/, wasm32-unknown-unknown)
        run: cargo clippy --locked --manifest-path sky/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: sky native test
        run: cargo test --locked --release --manifest-path sky/Cargo.toml
      - name: sky module under node
        run: scripts/run_sky_wasm.sh
      # a page's module carries no build path and does not depend on the build directory
      - name: wasm path scan tests
        run: python3 scripts/test_wasm_path_scan.py
      - name: the star table's generator (tests)
        run: python3 scripts/test_gen_star_table.py
      # another crate's PREVIOUS_*_SEMANTICS_IDS is used only as a whole list (an upstream empties it on
      # a major version; scripts/upstream_previous_ids_check.py, shared with the other ALICE crates)
      - name: Upstream previous identifiers (test, then whole-list uses only)
        run: |
          python3 scripts/test_upstream_previous_ids_check.py
          python3 scripts/upstream_previous_ids_check.py
      # every tracked Cargo.lock takes each alice-* crate by git and with the same source as the other
      # locks (scripts/lock_sources_check.py, shared with the other ALICE crates; exemptions in
      # scripts/lock_sources.toml); no lock read fails
      - name: Lock sources and agreement across workspaces (test, then check)
        run: |
          python3 scripts/test_lock_sources_check.py
          python3 scripts/lock_sources_check.py
      - name: sky module is the same built in 2 directories
        run: scripts/sky_wasm_repro.sh

  clippy:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # clippy.toml forbids the platform f64 transcendentals, mul_add, the wall
      # clock, threads and hash-ordered collections
      - name: clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (no_std lib)
        run: cargo clippy --locked --lib --no-default-features -- -D warnings
      - name: Doc (warnings are errors)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --lib --no-deps

  no-std:
    name: no_std (rlib, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure thumbv7em-none-eabihf rust-std is installed
        run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build rlib for a target without std
        run: cargo rustc --locked --lib --no-default-features --crate-type rlib --target thumbv7em-none-eabihf

  msrv:
    name: MSRV (rust-version = 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # `rust-version` is only true if this compiles; bump both together
      - name: cargo check on MSRV
        run: |
          cargo +1.85 check --lib --locked
          cargo +1.85 check --lib --locked --no-default-features

  oracle:
    # the reference tables and the generated coefficient table are reproduced
    # from their sources (ERFA, CSPICE, the NAIF kernel, ERFA dtdb.c), each
    # checked by SHA-256, with the pinned tool versions
    # on x86_64 and arm64: each must regenerate the committed tables byte for
    # byte, so the tables are shown not to depend on the machine
    name: Reference tables reproduce from their sources (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # creates the pinned virtual environment, fetches the sources (each
      # checked by SHA-256 in the generators) and compares the outputs
      - name: Reference tables reproduce (src/fb1990_table.rs, tests/golden)
        run: scripts/oracle_check.sh
