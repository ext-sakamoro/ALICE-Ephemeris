[package]
name = "alice-ephemeris"
version = "0.1.0"
edition = "2021"
# MSRV-aware dependency resolution (cargo 1.84+)
resolver = "3"
rust-version = "1.85"
authors = ["Moroya Sakamoto"]
description = "Deterministic astronomical time scales (UTC, TAI, TT, TDB), Julian dates and leap seconds, bit-identical on every platform — no_std"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Ephemeris"
readme = "README.md"
keywords = ["astronomy", "time", "leap-seconds", "tdb", "deterministic"]
categories = ["science", "date-and-time", "no-std"]
exclude = ["/.github", "/scripts", "/deny.toml", "/browser"]

[dependencies]
# every f64 transcendental goes through alice-det-math (bit-identical on all targets)
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", branch = "main", version = "0.6", default-features = false }

[features]
default = ["std"]
# `std`: alice-det-math's hardware sqrt (IEEE correctly rounded, so the results
# are bit-identical without it). This crate itself uses only `core`.
std = ["alice-det-math/std"]

[dev-dependencies]
# the Law identifier checks' hashing (browser/src/law_digest.rs), shared with the browser build
alice-ephemeris-browser = { path = "browser" }
sha1 = { version = "0.10", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# one workspace: a package outside the workspace root gets Cargo metadata from its absolute path,
# and that path then reaches the code of a wasm built from it (the same source gave different bytes
# in two directories); inside it, the path is relative
[workspace]
members = [".", "browser", "sky"]
default-members = ["."]
exclude = ["fuzz"]

# browser/: the Law checks for wasm32-unknown-unknown
[profile.browser]
inherits = "release"
lto = true
codegen-units = 1

# sky/: the module a web page loads
[profile.sky]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
