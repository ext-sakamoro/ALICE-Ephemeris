# scripts/mutants-equivalent.txt lists the surviving mutants that cannot change a result, each with
# its reason; scripts/mutants_equivalent_check.py compares it with a cargo-mutants run. No mutants run
# here: this checks the comparison itself (its tests) and the list's form on every OS.
name: Equivalent mutants list

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  list:
    name: Equivalent mutants list (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Equivalent mutants list (tests, then check)
        shell: bash
        run: |
          python scripts/test_mutants_equivalent_check.py
          python scripts/mutants_equivalent_check.py --list-only
